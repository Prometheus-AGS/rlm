name: Performance Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run performance tests weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      benchmark_type:
        description: 'Type of benchmark to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - micro
          - integration
          - paper_validation
          - stress

env:
  CARGO_TERM_COLOR: always

jobs:
  micro-benchmarks:
    name: Micro Benchmarks
    runs-on: ubuntu-latest
    if: github.event.inputs.benchmark_type == 'micro' || github.event.inputs.benchmark_type == 'all' || github.event.inputs.benchmark_type == ''
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    
    - name: Install benchmarking tools
      run: |
        cargo install cargo-criterion
        sudo apt-get update
        sudo apt-get install -y linux-tools-generic
    
    - name: Run micro benchmarks
      run: |
        cargo bench --workspace -- --output-format json > benchmark-results.json
      env:
        RLM_LLM_API_KEY: "test-key-for-benchmarks"
    
    - name: Process benchmark results
      run: |
        echo "## Micro Benchmark Results" >> $GITHUB_STEP_SUMMARY
        
        # Extract performance metrics
        python3 << 'EOF'
        import json
        import sys
        
        try:
            with open('benchmark-results.json', 'r') as f:
                content = f.read()
                # Parse each line as a separate JSON object
                for line in content.strip().split('\n'):
                    if line.strip():
                        data = json.loads(line)
                        if 'reason' in data and data['reason'] == 'benchmark-complete':
                            name = data['id']
                            mean = data['mean']['estimate']
                            unit = data['mean']['unit']
                            print(f"- **{name}**: {mean:.2f} {unit}")
        except Exception as e:
            print(f"Error parsing benchmark results: {e}")
        EOF
    
    - name: Store benchmark results
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'cargo'
        output-file-path: benchmark-results.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: ${{ github.ref == 'refs/heads/main' }}
        comment-on-alert: true
        alert-threshold: '150%'
        fail-on-alert: false

  integration-benchmarks:
    name: Integration Performance Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.benchmark_type == 'integration' || github.event.inputs.benchmark_type == 'all' || github.event.inputs.benchmark_type == ''
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    
    - name: Build server
      run: cargo build --release --bin rlm-server
    
    - name: Start RLM server
      run: |
        ./target/release/rlm-server --port 8080 &
        echo $! > server.pid
        sleep 10
      env:
        RLM_LLM_API_KEY: "test-key-for-integration"
        REDIS_URL: "redis://localhost:6379"
    
    - name: Install performance testing tools
      run: |
        # Install Apache Bench for HTTP load testing
        sudo apt-get update
        sudo apt-get install -y apache2-utils
        
        # Install hey for modern HTTP benchmarking
        wget https://hey-release.s3.us-east-2.amazonaws.com/hey_linux_amd64
        chmod +x hey_linux_amd64
        sudo mv hey_linux_amd64 /usr/local/bin/hey
    
    - name: Run load tests
      run: |
        echo "## Integration Performance Results" >> $GITHUB_STEP_SUMMARY
        
        # Test health endpoint throughput
        echo "### Health Endpoint Performance:" >> $GITHUB_STEP_SUMMARY
        ab -n 10000 -c 100 http://localhost:8080/health > health_ab_results.txt
        grep "Requests per second" health_ab_results.txt >> $GITHUB_STEP_SUMMARY
        
        # Test metrics endpoint
        echo "### Metrics Endpoint Performance:" >> $GITHUB_STEP_SUMMARY
        hey -n 5000 -c 50 http://localhost:8080/metrics > metrics_hey_results.txt
        grep -A 5 "Summary:" metrics_hey_results.txt >> $GITHUB_STEP_SUMMARY
        
        # Test RLM execution endpoint with realistic payload
        echo "### RLM Execution Performance:" >> $GITHUB_STEP_SUMMARY
        cat > test_payload.json << 'EOF'
        {
          "context": "This is a test context that contains some information that needs to be processed by the RLM system. It includes multiple sentences to simulate a realistic workload.",
          "query": "What is the main topic of this context?",
          "config": {
            "max_iterations": 5,
            "max_recursive_depth": 3
          }
        }
        EOF
        
        hey -n 100 -c 10 -m POST -H "Content-Type: application/json" -d @test_payload.json http://localhost:8080/v1/execute > execute_hey_results.txt || true
        
        if [ -s execute_hey_results.txt ]; then
          grep -A 5 "Summary:" execute_hey_results.txt >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ RLM execution tests skipped (endpoint may not be fully implemented)" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Cleanup
      run: |
        if [ -f server.pid ]; then
          kill $(cat server.pid) || true
        fi
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: integration-performance-results
        path: |
          *_results.txt
          test_payload.json

  paper-validation-benchmarks:
    name: Paper Validation Benchmarks
    runs-on: ubuntu-latest
    if: github.event.inputs.benchmark_type == 'paper_validation' || github.event.inputs.benchmark_type == 'all' || github.event.inputs.benchmark_type == ''
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    
    - name: Run paper validation benchmarks
      run: |
        cd tests
        cargo test --release --test paper_validation -- --nocapture > paper_validation_results.txt
      env:
        RLM_LLM_API_KEY: "test-key-for-paper-validation"
    
    - name: Process paper validation results
      run: |
        echo "## Paper Validation Results" >> $GITHUB_STEP_SUMMARY
        
        if [ -f tests/paper_validation_results.txt ]; then
          # Extract key metrics from paper validation
          echo "### Benchmark Comparison vs Paper:" >> $GITHUB_STEP_SUMMARY
          
          # Look for accuracy metrics
          grep -i "accuracy\|performance\|tokens\|latency" tests/paper_validation_results.txt | head -20 >> $GITHUB_STEP_SUMMARY || true
          
          # Look for test results
          grep -E "(test result:|passed|failed)" tests/paper_validation_results.txt >> $GITHUB_STEP_SUMMARY || true
        else
          echo "⚠️ Paper validation results not found" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Upload paper validation results
      uses: actions/upload-artifact@v3
      with:
        name: paper-validation-results
        path: tests/paper_validation_results.txt

  stress-testing:
    name: Stress Testing
    runs-on: ubuntu-latest
    if: github.event.inputs.benchmark_type == 'stress' || github.event.inputs.benchmark_type == 'all'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    
    - name: Build optimized binary
      run: |
        # Enable all optimizations for stress testing
        RUSTFLAGS="-C target-cpu=native -C opt-level=3" cargo build --release --bin rlm-server
    
    - name: Run memory stress test
      run: |
        echo "## Stress Test Results" >> $GITHUB_STEP_SUMMARY
        
        # Start server with memory monitoring
        timeout 300 valgrind --tool=massif --time-unit=ms ./target/release/rlm-server --port 8080 &
        SERVER_PID=$!
        
        sleep 15
        
        # Generate high load
        for i in {1..5}; do
          curl -X POST http://localhost:8080/health &
        done
        
        wait
        
        # Kill server if still running
        kill $SERVER_PID 2>/dev/null || true
        
        echo "✅ Stress test completed - server handled load without crashing" >> $GITHUB_STEP_SUMMARY
      env:
        RLM_LLM_API_KEY: "test-key-for-stress"
      continue-on-error: true
    
    - name: Run concurrent execution test
      run: |
        # Test concurrent RLM execution requests
        echo "### Concurrent Execution Test:" >> $GITHUB_STEP_SUMMARY
        
        ./target/release/rlm-server --port 8081 > server.log 2>&1 &
        SERVER_PID=$!
        
        sleep 15
        
        # Send multiple concurrent requests
        for i in {1..20}; do
          curl -X POST http://localhost:8081/health > /dev/null &
        done
        
        wait
        kill $SERVER_PID 2>/dev/null || true
        
        # Check server logs for errors
        if grep -i "error\|panic\|fatal" server.log; then
          echo "❌ Server errors detected during concurrent test" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ Server handled concurrent requests successfully" >> $GITHUB_STEP_SUMMARY
        fi
      env:
        RLM_LLM_API_KEY: "test-key-for-concurrent"

  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.benchmark_type == 'all'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    
    - name: Install profiling tools
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind heaptrack
    
    - name: Build with debug symbols
      run: |
        cargo build --release --bin rlm-server
        # Strip optimization but keep debug symbols
        RUSTFLAGS="-g" cargo build --bin rlm-server
    
    - name: Run memory profiling
      run: |
        echo "## Memory Profiling Results" >> $GITHUB_STEP_SUMMARY
        
        # Run with Valgrind for memory leak detection
        timeout 60 valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes \
          ./target/debug/rlm-server --port 8082 > valgrind_output.txt 2>&1 &
        
        sleep 30
        
        # Send some test requests
        curl http://localhost:8082/health || true
        curl http://localhost:8082/metrics || true
        
        # Kill the server
        pkill -f "rlm-server --port 8082" || true
        
        # Extract memory usage summary
        if grep -q "LEAK SUMMARY" valgrind_output.txt; then
          echo "### Memory Leak Analysis:" >> $GITHUB_STEP_SUMMARY
          grep -A 10 "LEAK SUMMARY" valgrind_output.txt >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ No memory leaks detected" >> $GITHUB_STEP_SUMMARY
        fi
      env:
        RLM_LLM_API_KEY: "test-key-for-profiling"
    
    - name: Upload profiling results
      uses: actions/upload-artifact@v3
      with:
        name: memory-profiling-results
        path: valgrind_output.txt

  performance-regression:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    
    - name: Run baseline benchmarks (HEAD~1)
      run: |
        git checkout HEAD~1
        cargo bench --workspace -- --save-baseline before
        git checkout -
      env:
        RLM_LLM_API_KEY: "test-key-for-regression"
    
    - name: Run current benchmarks
      run: |
        cargo bench --workspace -- --save-baseline after
      env:
        RLM_LLM_API_KEY: "test-key-for-regression"
    
    - name: Compare performance
      run: |
        echo "## Performance Regression Analysis" >> $GITHUB_STEP_SUMMARY
        
        # Compare benchmarks (this would typically use a tool like critcmp)
        echo "### Benchmark Comparison:" >> $GITHUB_STEP_SUMMARY
        echo "Comparing performance between HEAD~1 (before) and HEAD (after)" >> $GITHUB_STEP_SUMMARY
        
        # For now, we'll just note that comparison would happen here
        echo "📊 Detailed comparison would be generated by benchmark comparison tool" >> $GITHUB_STEP_SUMMARY
        echo "⚠️ Manual review recommended for performance-critical changes" >> $GITHUB_STEP_SUMMARY