name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'crates/**/src/**/*.rs'
      - 'README.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'crates/**/src/**/*.rs'
      - 'README.md'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  docs-build:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    
    - name: Build documentation
      run: |
        cargo doc --workspace --no-deps --all-features --document-private-items
    
    - name: Check for documentation warnings
      run: |
        echo "## Documentation Build Results" >> $GITHUB_STEP_SUMMARY
        
        # Build docs and capture warnings
        cargo doc --workspace --no-deps --all-features 2> doc_warnings.txt || true
        
        if [ -s doc_warnings.txt ]; then
          WARNING_COUNT=$(wc -l < doc_warnings.txt)
          echo "⚠️ Documentation warnings found: $WARNING_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "### Warnings:" >> $GITHUB_STEP_SUMMARY
          head -20 doc_warnings.txt | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ Documentation built without warnings" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Test documentation examples
      run: |
        echo "### Documentation Tests:" >> $GITHUB_STEP_SUMMARY
        cargo test --doc --workspace --all-features 2>&1 | tee doc_test_results.txt
        
        if grep -q "test result: ok" doc_test_results.txt; then
          echo "✅ All documentation examples pass" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Some documentation examples failed" >> $GITHUB_STEP_SUMMARY
        fi
      env:
        RLM_LLM_API_KEY: "test-key-for-doc-tests"
    
    - name: Check documentation coverage
      run: |
        # Install documentation coverage tool
        cargo install cargo-doc-coverage || true
        
        if command -v cargo-doc-coverage >/dev/null 2>&1; then
          echo "### Documentation Coverage:" >> $GITHUB_STEP_SUMMARY
          cargo doc-coverage --workspace | tee doc_coverage.txt
          
          # Extract coverage percentage
          if grep -q "Total" doc_coverage.txt; then
            grep "Total" doc_coverage.txt >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "📊 Documentation coverage tool not available" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: |
          target/doc/
          doc_warnings.txt
          doc_test_results.txt
          doc_coverage.txt

  docs-deploy:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: docs-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    
    - name: Build documentation
      run: |
        cargo doc --workspace --no-deps --all-features
    
    - name: Prepare docs for deployment
      run: |
        # Create index.html that redirects to main crate docs
        cat > target/doc/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <meta charset="utf-8">
            <title>RLM Documentation</title>
            <meta http-equiv="refresh" content="0; url=rlm_core/index.html">
        </head>
        <body>
            <p>Redirecting to <a href="rlm_core/index.html">RLM documentation</a>...</p>
        </body>
        </html>
        EOF
        
        # Add CNAME file if deploying to custom domain
        # echo "docs.rlm.example.com" > target/doc/CNAME
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/doc
        cname: false # Set to your custom domain if needed

  changelog-update:
    name: Update Changelog
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Generate changelog entry
      run: |
        # Get the last tag
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        if [ -z "$LAST_TAG" ]; then
          echo "## Unreleased Changes" > new_changelog.md
          git log --pretty=format:"- %s (%h)" >> new_changelog.md
        else
          echo "## Unreleased Changes" > new_changelog.md
          git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" >> new_changelog.md
        fi
        
        echo "" >> new_changelog.md
        
        # Prepend to existing changelog if it exists
        if [ -f CHANGELOG.md ]; then
          cat CHANGELOG.md >> new_changelog.md
          mv new_changelog.md CHANGELOG.md
        else
          mv new_changelog.md CHANGELOG.md
        fi
    
    - name: Commit changelog update
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        if git diff --quiet CHANGELOG.md; then
          echo "No changelog changes to commit"
        else
          git add CHANGELOG.md
          git commit -m "docs: update changelog [skip ci]"
          git push
        fi

  link-checker:
    name: Check Documentation Links
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check markdown links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'no'
        config-file: '.github/markdown-link-check-config.json'
        folder-path: 'docs/'
    
    - name: Check README links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'no'
        file-path: 'README.md'

  spell-check:
    name: Spell Check Documentation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install spell checker
      run: |
        sudo apt-get update
        sudo apt-get install -y aspell aspell-en
    
    - name: Check spelling in documentation
      run: |
        echo "## Spell Check Results" >> $GITHUB_STEP_SUMMARY
        
        # Create custom dictionary for technical terms
        cat > .aspell.en.pws << 'EOF'
        personal_ws-1.1 en 50
        RLM
        REPL
        Rhai
        OpenAI
        API
        JSON
        HTTP
        SSE
        WASM
        UAR
        LLM
        arXiv
        containerization
        async
        Tokio
        rustfmt
        clippy
        GitHub
        codebase
        config
        subqueries
        middleware
        aggregation
        namespace
        Kubernetes
        dockerfile
        EOF
        
        # Check documentation files
        find docs/ -name "*.md" -exec aspell --personal=.aspell.en.pws --lang=en_US check {} \; > spell_errors.txt 2>&1 || true
        
        # Check README
        aspell --personal=.aspell.en.pws --lang=en_US check README.md >> spell_errors.txt 2>&1 || true
        
        if [ -s spell_errors.txt ]; then
          echo "⚠️ Potential spelling issues found" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ No obvious spelling errors detected" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Upload spell check results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: spell-check-results
        path: |
          spell_errors.txt
          .aspell.en.pws

  docs-validation:
    name: Validate Documentation Structure
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate documentation structure
      run: |
        echo "## Documentation Structure Validation" >> $GITHUB_STEP_SUMMARY
        
        # Check required documentation files
        REQUIRED_DOCS=(
          "README.md"
          "CLAUDE.md"
          "DOCKER.md"
          "docs/quickstart.md"
          "docs/api.md"
          "docs/deployment.md"
        )
        
        MISSING_DOCS=()
        for doc in "${REQUIRED_DOCS[@]}"; do
          if [ ! -f "$doc" ]; then
            MISSING_DOCS+=("$doc")
          fi
        done
        
        if [ ${#MISSING_DOCS[@]} -eq 0 ]; then
          echo "✅ All required documentation files present" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Missing documentation files:" >> $GITHUB_STEP_SUMMARY
          for missing in "${MISSING_DOCS[@]}"; do
            echo "- $missing" >> $GITHUB_STEP_SUMMARY
          done
        fi
        
        # Check for orphaned documentation files
        echo "### Documentation File Overview:" >> $GITHUB_STEP_SUMMARY
        find . -name "*.md" -not -path "./target/*" -not -path "./.git/*" | sort >> $GITHUB_STEP_SUMMARY
        
        # Validate internal links in main docs
        echo "### Internal Link Validation:" >> $GITHUB_STEP_SUMMARY
        
        # Check if docs reference existing files
        grep -r "\]\(" docs/ --include="*.md" | while read -r line; do
          file=$(echo "$line" | cut -d: -f1)
          link=$(echo "$line" | sed -n 's/.*](\([^)]*\)).*/\1/p')
          
          # Skip external URLs
          if [[ "$link" =~ ^https?:// ]]; then
            continue
          fi
          
          # Check if referenced file exists
          if [[ "$link" =~ ^[^#]*$ ]] && [ ! -f "docs/$link" ] && [ ! -f "$link" ]; then
            echo "⚠️ Broken link in $file: $link" >> $GITHUB_STEP_SUMMARY
          fi
        done || true