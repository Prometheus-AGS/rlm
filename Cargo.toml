[workspace]
resolver = "2"
members = [
    "crates/rlm-core",
    "crates/rlm-repl-rhai",
    "crates/rlm-server",
    "crates/rlm-ffi",
    "crates/rlm-uar-adapter",
    "crates/rlm-test-utils",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
authors = ["Travis James <tjames@prometheus-ags.ai>"]
license = "MIT"
repository = "https://github.com/Prometheus-AGS/rlm"
homepage = "https://prometheus-ags.ai/rlm"
keywords = ["llm", "context", "recursion", "repl", "rlm"]
categories = ["algorithms", "api-bindings", "web-programming"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12" 

# Error handling
thiserror = "2.0.18"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }

# Identifiers
uuid = { version = "1.10", features = ["v4"] }

# HTTP server (server crate only)
axum = { version = "0.8.8", features = ["ws", "macros"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
hyper = "1.0"

# HTTP client (for LLM providers)
reqwest = { version = "0.13.1", features = ["json", "stream"] }

# REPL backend
rhai = { version = "1.19", features = ["sync", "serde", "metadata"] }

# WASM support
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Testing
mockall = "0.14.0"
wiremock = "0.6"
proptest = "1.4"

# Internal crates
rlm-core = { path = "crates/rlm-core" }
rlm-repl-rhai = { path = "crates/rlm-repl-rhai" }
rlm-server = { path = "crates/rlm-server" }
rlm-ffi = { path = "crates/rlm-ffi" }
rlm-uar-adapter = { path = "crates/rlm-uar-adapter" }
rlm-test-utils = { path = "crates/rlm-test-utils" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
cargo = "warn"
# Allow some pedantic lints that are too noisy
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
debug = true

# WASM-specific profile
[profile.wasm-release]
inherits = "release"
opt-level = "z"     # Optimize for size
lto = true
codegen-units = 1
panic = "abort"
