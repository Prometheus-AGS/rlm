[package]
name = "rlm-test-utils"
version = "0.1.0"
edition = "2021"
description = "Integration testing utilities for RLM with secure key management"
license = "MIT OR Apache-2.0"
repository = "https://github.com/prometheus-labs/rlm"
keywords = ["testing", "integration", "llm", "vault", "security"]

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for API calls
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Key vault integrations
vault = { version = "10.2", optional = true }
aws-sdk-secretsmanager = { version = "1.0", optional = true }
azure_security_keyvault = { version = "0.20", optional = true }
azure_core = { version = "0.20", optional = true }
azure_identity = { version = "0.20", optional = true }
postgrest = { version = "1.0", optional = true }

# Testing framework
rstest = "0.18"
mockito = "1.2"
wiremock = "0.5"
tempfile = "3.8"

# RLM dependencies
rlm-core = { path = "../rlm-core" }

[dev-dependencies]
tokio-test = "0.4"
serial_test = "3.0"
tracing-test = "0.2"

[features]
default = ["local-vault"]
local-vault = []
hashicorp-vault = ["vault"]
aws-secrets = ["aws-sdk-secretsmanager"]
azure-keyvault = ["azure_security_keyvault", "azure_core", "azure_identity"]
supabase-vault = ["postgrest"]
all-providers = ["aws-secrets", "azure-keyvault", "supabase-vault"]